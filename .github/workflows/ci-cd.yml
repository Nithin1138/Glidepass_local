name: GlidePass & LANpad CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - lanpadv2
      - checkall
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - lanpadv2
      - checkall
  workflow_dispatch:

jobs:
  integrate:
    name: Continuous Integration (Next.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: glidepass
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website-v2/package-lock.json

      - name: Install Dependencies
        run: |
          cd website-v2
          npm ci

      - name: TypeScript Type Check
        run: |
          cd website-v2
          npx tsc --noEmit

      - name: Run Next.js Build
        run: |
          cd website-v2
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/glidepass"

  docker-publish:
    name: Build & Publish Docker Container
    needs: integrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./website-v2
          file: ./website-v2/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/glidepass-web:latest
            ghcr.io/${{ github.repository }}/glidepass-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-flutter-client-apps:
    name: Build Flutter Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd lanpad_mobile
          flutter pub get

      - name: Build Flutter macOS Desktop App
        if: matrix.os == 'macos-latest'
        run: |
          cd lanpad_mobile
          flutter build macos --release

      - name: Package macOS App Bundle & DMG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p lanpad_mobile/build/macos/Build/Products/Release/lanpad.app/Contents/Resources/backend
          cp *.py requirements.txt lanpad_mobile/build/macos/Build/Products/Release/lanpad.app/Contents/Resources/backend/ || true
          cp -r templates assets lanpad_mobile/build/macos/Build/Products/Release/lanpad.app/Contents/Resources/backend/ || true
          hdiutil create -volname "LANpad" -srcfolder lanpad_mobile/build/macos/Build/Products/Release/lanpad.app -ov -format UDZO LANpad_macOS.dmg

      - name: Build Flutter Windows Desktop App
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          cd lanpad_mobile
          flutter build windows --release

      - name: Package Windows Executable & Zip
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Copy-Item -Path "*.py" -Destination "lanpad_mobile\build\windows\x64\runner\Release\" -Force
          if (Test-Path "requirements.txt") {
            Copy-Item -Path "requirements.txt" -Destination "lanpad_mobile\build\windows\x64\runner\Release\" -Force
          }
          if (Test-Path "templates") {
            Copy-Item -Path "templates" -Destination "lanpad_mobile\build\windows\x64\runner\Release\templates" -Recurse -Force
          }
          if (Test-Path "assets") {
            Copy-Item -Path "assets" -Destination "lanpad_mobile\build\windows\x64\runner\Release\assets" -Recurse -Force
          }

          # Build Inno Setup Standalone Installer (.exe)
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging\windows\inno_setup.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" packaging\windows\inno_setup.iss
          } else {
            choco install innosetup --yes --no-progress
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" packaging\windows\inno_setup.iss
          }
          # Apply Authenticode digital signature
          try {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=LANpad, O=GlidePass" -CertStoreLocation Cert:\CurrentUser\My
            Set-AuthenticodeSignature -Certificate $cert -FilePath "LANpad-Setup.exe" -HashAlgorithm SHA256
          } catch {
            Write-Host "Authenticode notice: $_"
          }

          Copy-Item -Path "LANpad-Setup.exe" -Destination "LANpad-Windows-Installer.exe" -Force
          Compress-Archive -Path "lanpad_mobile\build\windows\x64\runner\Release\*" -DestinationPath "LANpad-Windows.zip" -Force

      - name: Upload macOS DMG Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: LANpad-macOS-DMG
          path: LANpad_macOS.dmg
          if-no-files-found: error

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: LANpad-Windows-EXE
          path: |
            LANpad-Setup.exe
            LANpad-Windows-Installer.exe
            LANpad-Windows.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Production Release
    needs: build-flutter-client-apps
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/checkall' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LANpad-macOS-DMG
          path: release-artifacts/mac

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LANpad-Windows-EXE
          path: release-artifacts/win

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.4.1"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=LANpad Desktop Release $TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          files: |
            release-artifacts/mac/LANpad_macOS.dmg
            release-artifacts/win/LANpad-Setup.exe
            release-artifacts/win/LANpad-Windows-Installer.exe
            release-artifacts/win/LANpad-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
