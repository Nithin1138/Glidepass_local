name: GlidePass CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - lanpadv2
  pull_request:
    branches:
      - main
      - master
      - lanpadv2

jobs:
  integrate:
    name: Continuous Integration (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: website-v2/package-lock.json

      - name: Install Dependencies
        run: |
          cd website-v2
          npm ci

      - name: TypeScript Type Check
        run: |
          cd website-v2
          npx tsc --noEmit

      - name: Run Next.js Build
        run: |
          cd website-v2
          npm run build
        env:
          # Ensure build succeeds without failing on external API connection warnings during build phase
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/glidepass"

  docker-publish:
    name: Build & Publish Docker Container
    needs: integrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./website-v2
          file: ./website-v2/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/glidepass-web:latest
            ghcr.io/${{ github.repository }}/glidepass-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
