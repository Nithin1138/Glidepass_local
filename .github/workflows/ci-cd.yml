name: GlidePass CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - lanpadv2
      - checkall
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - lanpadv2
      - checkall
  workflow_dispatch:

jobs:
  integrate:
    name: Continuous Integration (Next.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: glidepass
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website-v2/package-lock.json

      - name: Install Dependencies
        run: |
          cd website-v2
          npm ci

      - name: TypeScript Type Check
        run: |
          cd website-v2
          npx tsc --noEmit

      - name: Run Next.js Build
        run: |
          cd website-v2
          npm run build
        env:
          # Ensure build succeeds without failing on external API connection warnings during build phase
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/glidepass"

  docker-publish:
    name: Build & Publish Docker Container
    needs: integrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./website-v2
          file: ./website-v2/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/glidepass-web:latest
            ghcr.io/${{ github.repository }}/glidepass-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client-apps:
    name: Build Client Apps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller Pillow requests httpx fastapi uvicorn pyautogui pyperclip pystray qrcode pynput python-multipart

      - name: Install macOS specific dependencies
        if: matrix.os == 'macos-latest'
        run: |
          pip install rumps

      - name: Build macOS Client & DMG
        if: matrix.os == 'macos-latest'
        env:
          CI: "true"
        run: |
          chmod +x build_mac.sh make_dmg.sh
          ./build_mac.sh
          ./make_dmg.sh

      - name: Build Windows Client Executable
        if: matrix.os == 'windows-latest'
        env:
          CI: "true"
        run: |
          ./build_win.bat

      - name: Upload macOS DMG Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: LANpad-macOS-DMG
          path: LANpad_Installer.dmg
          if-no-files-found: error

      - name: Upload Windows EXE Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: LANpad-Windows-EXE
          path: dist/LANpad.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-client-apps
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LANpad-macOS-DMG
          path: release-artifacts/mac
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LANpad-Windows-EXE
          path: release-artifacts/win
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/mac/LANpad_Installer.dmg
            release-artifacts/win/LANpad.exe
          draft: false
          prerelease: false
          generate_release_notes: true
